name = "guard"
main = "src/index.ts"
compatibility_date = "2026-10-02"

[assets]
directory = "../dashboard/dist"
not_found_handling = "single-page-application"

[vars]
DAILY_REQUEST_CAP = "100000"

[[durable_objects.bindings]]
name = "LIMITER_DO"
class_name = "LimiterDO"

[[durable_objects.bindings]]
name = "STATS_DO"
class_name = "StatsDO"

[[ratelimits]]
name = "EDGE_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiterDO", "StatsDO"]
